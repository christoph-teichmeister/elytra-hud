name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every release in the pack.mcmeta format range (101-121).
        minecraft: ["26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
    name: server (${{ matrix.minecraft }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: zip -r elytra-hud.zip pack.mcmeta data overlay_* LICENSE README.md
      - run: .github/scripts/server-test.sh "${{ matrix.minecraft }}" elytra-hud.zip
