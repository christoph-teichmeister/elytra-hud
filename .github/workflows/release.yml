name: Release

on:
  push:
    branches: [main]
    # Only changes to what the game loads make a release; README, CI and art do not.
    paths:
      - pack.mcmeta
      - pack.png
      - data/**
      - overlay_*/**
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 1.2.0); empty = from the commit type"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            next="v$INPUT"
          else
            last=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            next=$(.github/scripts/next-version.sh "$last" "$(git log -1 --format=%B)")
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: zip -r elytra-hud.zip pack.mcmeta pack.png data overlay_* LICENSE README.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.tag }}" elytra-hud.zip --target "$GITHUB_SHA" --generate-notes

      - name: Upload to CurseForge
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" --json body -q .body > changelog.md
          .github/scripts/curseforge-upload.sh elytra-hud.zip "Elytra HUD ${TAG#v}" changelog.md
