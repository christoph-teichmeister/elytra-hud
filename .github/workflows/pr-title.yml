name: PR title

# Squash merges use the PR title as the commit on main, so this enforces
# Conventional Commits there; the local commit-msg hook is only a convenience.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
